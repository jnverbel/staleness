name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      # Never cancel the other platforms because one failed: when a
      # permutation test diverges, which platforms it diverges on IS the
      # diagnosis.
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          # Ubuntu runners bill at 1x, so reaching back a few releases is
          # cheap. oldrel-4 is R 4.2.3, which is exactly the minimum
          # DESCRIPTION declares — the promise and the evidence match.
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}
          - {os: ubuntu-latest,  r: 'oldrel-4'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      # Needed to build the rmarkdown vignettes.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # --no-manual: the vignettes are html_vignette, so nothing in the
      # package needs LaTeX and building the PDF manual would be the only
      # thing pulling it in.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

      # R CMD check runs the tests against the built package, where README.md
      # is not reachable from the test directory, so the test that pins the
      # README's worked output to the real output skips there. Running the
      # suite once against the source closes that gap: the README is the only
      # documentation written by hand rather than regenerated, and it has
      # already drifted once.
      - name: Tests against the source tree (covers the README check)
        if: runner.os == 'Linux' && matrix.config.r == 'release'
        run: |
          testthat::test_local(reporter = "summary", stop_on_failure = TRUE)
        shell: Rscript {0}
